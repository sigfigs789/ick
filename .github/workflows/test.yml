name: Test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  native:
    name: Typecheck the native app
    runs-on: ubuntu-latest

    # The phone app imports the game from src/ rather than copying it, so a
    # change there can break the native build without touching native/ at all
    # -- #341 removed a function the app's guess log still called, and nothing
    # noticed until a store build was due. With over-the-air updates the same
    # break would ship to phones as a crash, so every PR checks it.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            native/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix native

      - name: Typecheck
        working-directory: native
        run: npx tsc --noEmit

      # Over-the-air updates reach builds by runtimeVersion, a label set by hand
      # in native/app.json. This fails when the native layer changed and the
      # label did not, before an update could reach builds missing that code.
      - name: Check the runtime version follows the native layer
        working-directory: native
        run: node tools/check-native-fingerprint.cjs
