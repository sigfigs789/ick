name: Bump app version

# Bumps the deploy version in src/version.ts and pushes the change straight to
# main, authored as sigfigs789 so Vercel deploys it (commits authored by anyone
# else, github-actions[bot] included, are blocked and never build).
# Runs every Friday on its own, and by hand from the Actions tab.
#
# The weekly bump is what paces the native app: its store version is
# 1.<APP_VERSION>, derived by native/app.config.js, so each Friday moves the
# target the app has to catch up to. The run checks that the native config
# resolves to the bumped version before pushing.
#
#   force_reload=false -> APP_VERSION += 1, MIN_VERSION untouched. An ordinary
#                         deploy: open tabs stay where they are.
#   force_reload=true  -> APP_VERSION += 1 and MIN_VERSION follows it, making the
#                         release mandatory: every open tab below the new floor
#                         silently reloads onto it (see src/hooks/useForceUpdate.ts).
#
# The scheduled run has no inputs, so it is always the ordinary kind.
#
# The build step re-checks the MIN_VERSION <= APP_VERSION invariant that
# vite.config.ts enforces, so a bad bump fails here rather than in production.

on:
  schedule:
    # Fridays, 15:00 UTC -- 9am Mountain in summer, 8am in winter.
    - cron: "0 15 * * 5"
  workflow_dispatch:
    inputs:
      force_reload:
        description: Also bump MIN_VERSION, forcing every open tab to reload onto this release
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# Two runs at once would both read the same APP_VERSION and bump to the same
# number; queue them instead.
concurrency:
  group: bump-version
  cancel-in-progress: false

jobs:
  bump-version:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Bump the version constants
        id: bump
        env:
          FORCE_RELOAD: ${{ inputs.force_reload }}
        run: python3 scripts/bump-version.py >> "$GITHUB_OUTPUT"

      - name: Check the native version follows
        id: native
        env:
          APP_VERSION: ${{ steps.bump.outputs.app_version }}
        run: |
          # app.config.js only needs Node built-ins, so no native install.
          native_version=$(node -p "require('./native/app.config.js')({ config: {} }).version")
          echo "Native store version: $native_version"
          if [ "$native_version" != "1.$APP_VERSION" ]; then
            echo "::error::native/app.config.js resolves to $native_version, expected 1.$APP_VERSION"
            exit 1
          fi
          echo "native_version=$native_version" >> "$GITHUB_OUTPUT"

      - name: Build (verifies the version invariant and emits version.json)
        run: |
          npm ci
          npm run build

      - name: Push the bump to main
        env:
          APP_VERSION: ${{ steps.bump.outputs.app_version }}
          PREVIOUS_APP_VERSION: ${{ steps.bump.outputs.previous_app_version }}
          MIN_VERSION: ${{ steps.bump.outputs.min_version }}
          PREVIOUS_MIN_VERSION: ${{ steps.bump.outputs.previous_min_version }}
          NATIVE_VERSION: ${{ steps.native.outputs.native_version }}
          FORCE_RELOAD: ${{ inputs.force_reload }}
          TRIGGER: ${{ github.event_name == 'schedule' && 'the weekly Friday run' || format('a manual run by @{0}', github.actor) }}
        run: |
          git config user.name 'sigfigs789'
          git config user.email '82550419+sigfigs789@users.noreply.github.com'
          git add src/version.ts
          if [ "$FORCE_RELOAD" = "true" ]; then
            title="Bump app version to $APP_VERSION (forced reload)"
          else
            title="Bump app version to $APP_VERSION"
          fi
          git commit -q -F - <<EOF
          $title

          APP_VERSION $PREVIOUS_APP_VERSION -> $APP_VERSION
          MIN_VERSION $PREVIOUS_MIN_VERSION -> $MIN_VERSION
          Native store version -> $NATIVE_VERSION

          Pushed by $TRIGGER.
          EOF
          # main may have moved while the build ran; replay the one-line bump
          # on top rather than failing. A conflict means someone edited
          # src/version.ts meanwhile, and the run stops for a human.
          git pull --rebase -q origin main
          git push origin HEAD:main
