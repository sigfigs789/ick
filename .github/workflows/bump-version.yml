name: Bump app version

# Bumps the deploy version in src/version.ts and opens a PR with the change.
# Runs every Friday on its own, and by hand from the Actions tab.
#
# The weekly bump is what paces the native app: its store version is
# 1.<APP_VERSION>, derived by native/app.config.js, so each Friday moves the
# target the app has to catch up to. The run checks that the native config
# resolves to the bumped version before opening the PR.
#
#   force_reload=false -> APP_VERSION += 1, MIN_VERSION untouched. An ordinary
#                         deploy: open tabs stay where they are.
#   force_reload=true  -> APP_VERSION += 1 and MIN_VERSION follows it, making the
#                         release mandatory: every open tab below the new floor
#                         silently reloads onto it (see src/hooks/useForceUpdate.ts).
#
# The scheduled run has no inputs, so it is always the ordinary kind.
#
# The build step re-checks the MIN_VERSION <= APP_VERSION invariant that
# vite.config.ts enforces, so a bad bump fails here rather than in production.

on:
  schedule:
    # Fridays, 15:00 UTC -- 9am Mountain in summer, 8am in winter.
    - cron: "0 15 * * 5"
  workflow_dispatch:
    inputs:
      force_reload:
        description: Also bump MIN_VERSION, forcing every open tab to reload onto this release
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-version:
    runs-on: ubuntu-latest

    steps:
      - name: Check out WordInk
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Bump the version constants
        id: bump
        env:
          FORCE_RELOAD: ${{ inputs.force_reload }}
        run: python3 scripts/bump-version.py >> "$GITHUB_OUTPUT"

      - name: Check the native version follows
        id: native
        env:
          APP_VERSION: ${{ steps.bump.outputs.app_version }}
        run: |
          # app.config.js only needs Node built-ins, so no native install.
          native_version=$(node -p "require('./native/app.config.js')({ config: {} }).version")
          echo "Native store version: $native_version"
          if [ "$native_version" != "1.$APP_VERSION" ]; then
            echo "::error::native/app.config.js resolves to $native_version, expected 1.$APP_VERSION"
            exit 1
          fi
          echo "native_version=$native_version" >> "$GITHUB_OUTPUT"

      - name: Build (verifies the version invariant and emits version.json)
        run: |
          npm ci
          npm run build

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Vercel authorizes a deployment by the commit's git author, and the
          # default (github-actions[bot]) isn't authorized on this project — the
          # preview build simply never gets created. Author as sigfigs789, which
          # is how every hand-made bump has landed.
          author: sigfigs789 <82550419+sigfigs789@users.noreply.github.com>
          committer: sigfigs789 <82550419+sigfigs789@users.noreply.github.com>
          branch: automated/bump-version-${{ github.run_id }}
          delete-branch: true
          commit-message: "Bump app version to ${{ steps.bump.outputs.app_version }}"
          title: "Bump app version to ${{ steps.bump.outputs.app_version }}${{ inputs.force_reload && ' (forced reload)' || '' }}"
          body: |
            Bumps the version constants in `src/version.ts`.

            | | before | after |
            | --- | --- | --- |
            | `APP_VERSION` | `${{ steps.bump.outputs.previous_app_version }}` | `${{ steps.bump.outputs.app_version }}` |
            | `MIN_VERSION` | `${{ steps.bump.outputs.previous_min_version }}` | `${{ steps.bump.outputs.min_version }}` |
            | Native store version | `1.${{ steps.bump.outputs.previous_app_version }}` | `${{ steps.native.outputs.native_version }}` |

            ${{ inputs.force_reload && 'MIN_VERSION follows APP_VERSION, so this release is **mandatory**: every open tab below the new floor silently reloads onto it once this is deployed. localStorage (game progress, streak) survives the reload.' || 'MIN_VERSION is unchanged, so this is an **optional** deploy — open tabs stay where they are and pick the new bundle up on their next load.' }}

            `npm run build` ran on the bumped constants, which re-checks the
            `MIN_VERSION <= APP_VERSION` invariant enforced in `vite.config.ts`,
            and `native/app.config.js` was checked to resolve to
            `${{ steps.native.outputs.native_version }}`. The next native build
            picks that version up with no further change.

            ${{ github.event_name == 'schedule' && 'Opened by the weekly Friday run.' || format('Run by hand by @{0}.', github.actor) }}
          add-paths: |
            src/version.ts
