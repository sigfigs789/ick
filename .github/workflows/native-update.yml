name: Native OTA update

# Publish the game to installed phone apps -- on request only.
#
# The app is a view layer over the repo's own src/ (see native/README.md), and a
# store build is a frozen copy of that code. This sends the chosen branch
# (normally main) to phones as an expo-updates bundle on the `production`
# channel, without a store review. Builds pick it up on their next launch, or at
# once when they find themselves below the leaderboard's floor
# (native/src/hooks/useUpdateCheck.ts) -- so raising MIN_RANKED_VERSION is the
# usual reason to run this.
#
# Manual rather than on every merge, deliberately: what reaches players' phones
# is a release decision, not a side effect of main moving. Run it from the
# Actions tab, or:
#
#   gh workflow run native-update.yml --repo sigfigs789/ick -f message="..."
#
# An update only reaches builds with the same runtimeVersion (native/app.json),
# a label raised by hand when the native layer changes. The fingerprint check
# below refuses to publish when the native layer moved and the label did not,
# since that update would reach builds missing the native code it needs.
#
# Needs an EXPO_TOKEN repository secret (an Expo access token for sigfigs789).
# Without one the job says so and stops.

on:
  workflow_dispatch:
    inputs:
      message:
        description: What this update changes (shown in the EAS dashboard). Defaults to the commit.
        required: false
        type: string

permissions:
  contents: read

# One publish at a time, and a second request waits rather than cancelling the
# first mid-upload.
concurrency:
  group: native-update
  cancel-in-progress: false

jobs:
  update:
    name: Publish update
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Check for an Expo token
        id: token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::warning::No EXPO_TOKEN secret, so no update was published. Add one to ship main to phones."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: steps.token.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            native/package-lock.json

      # Both installs: the bundle is built from native/ and from the shared src/
      # above it, whose imports resolve against the root's node_modules.
      - name: Install dependencies
        if: steps.token.outputs.present == 'true'
        run: |
          npm ci
          npm ci --prefix native

      # The same check the PR ran (test.yml), again here: this is the last step
      # before the code is on players' phones, and main can differ from any
      # one PR that passed.
      - name: Typecheck
        if: steps.token.outputs.present == 'true'
        working-directory: native
        run: npx tsc --noEmit

      - name: Check the runtime version follows the native layer
        if: steps.token.outputs.present == 'true'
        working-directory: native
        run: node tools/check-native-fingerprint.cjs

      - name: Publish to the production channel
        if: steps.token.outputs.present == 'true'
        working-directory: native
        # Through the environment rather than interpolated into the script, so a
        # message is only ever text.
        env:
          UPDATE_MESSAGE: ${{ inputs.message }}
        run: |
          subject=$(git log -1 --format=%s)
          message=$(printf '%s' "${UPDATE_MESSAGE:-$GITHUB_SHA $subject}" | head -n 1)
          npx eas-cli@latest update --channel production --platform ios \
            --message "$message" --non-interactive
