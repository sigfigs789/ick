name: Claude PR review

# Claude Code reviews a pull request against main only when asked: add the
# `claude review` label to the PR. It leaves inline comments on the lines it
# has concerns about and one summary comment. It does not approve, request
# changes, push, or merge -- it only comments. When it finishes it takes the
# label off again, so adding the label back asks for another pass.
#
# Nothing runs when a PR opens or on pushes. "@claude review this" (claude.yml)
# also gets a review, from the agent that can edit the branch.
#
# The daily fold check's PRs are left to claude-review-fold-pr.yml (see the job's
# `if`).
#
# Runs on the Claude subscription: it needs the CLAUDE_CODE_OAUTH_TOKEN
# repository secret, as the other Claude workflows do.

on:
  pull_request:
    branches: [main]
    types: [labeled]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: read
  statuses: read
  id-token: write

jobs:
  review:
    # Only the `claude review` label. Forks get no secrets, and fold check PRs
    # have their own reviewer.
    if: >-
      github.event.label.name == 'claude review' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.event.pull_request.head.ref, 'codex/fold-check-')
    # In the job, not the workflow, so adding some other label doesn't cancel a
    # review in progress.
    concurrency:
      group: claude-pr-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out WordInk
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Review with Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The run's own token, so the action does not need the Claude GitHub
          # App installed.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 60
            --allowedTools "Read,Glob,Grep,LS,Task,Agent,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*)"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request on WordInk, a daily word game. The working
            tree is the PR merged into main. Read AGENTS.md and README.md for
            context only -- ignore AGENTS.md's worktree, branch, commit, and
            PR steps. Then read the change with
            `gh pr view --json title,body,files` and `gh pr diff`.

            Look for real problems, most important first:
            - correctness bugs and regressions, including edge cases the change
              misses
            - scoring or fold changes that would score a word wrongly -- a
              derivative priced as a rare word, or a real word rejected
            - Supabase migrations that drop grants or break existing rows, and
              analytics or tracking writes that could block play
            - data files (src/data/*.json) edited inconsistently with the code
              that reads them
            - missing tests for new behavior
            Skip style nits and formatting; the repo has no prettier.

            Leave an inline comment with
            mcp__github_inline_comment__create_inline_comment on each line you
            have a concrete concern about, saying what goes wrong and how to
            fix it. Then post one summary comment with `gh pr comment`: a
            one-line verdict, then the issues ranked by severity. If you find
            nothing worth raising, say so in one line -- do not invent issues.
            Do not edit files.

      - name: Take the label off
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh pr edit ${{ github.event.pull_request.number }}
          --repo ${{ github.repository }}
          --remove-label "claude review"
