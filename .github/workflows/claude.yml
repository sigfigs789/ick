name: Claude

# Mention @claude in a pull request -- a PR comment, a review, or an inline
# review comment -- and Claude Code answers there, with free rein over the PR's
# branch: it reads the code, edits it, runs npm/python, and commits and pushes
# its changes to the PR. "@claude drop `abaser` from this PR's exemptions" or
# "@claude why is `transferals` scoped to prefix?" both work.
#
# Only the repository's owner, members, and collaborators can summon it; a
# mention from anyone else is ignored. It works on PRs from this repository,
# not forks.
#
# Claude pushes with the built-in GITHUB_TOKEN, and GitHub starts no workflows
# from that token's pushes -- so neither "Test" nor the fold-check review reruns
# on its commits. Claude runs the checks itself; re-review a fold check PR by
# hand with claude-review-fold-pr.yml.
#
# Runs on the Claude subscription: it needs the CLAUDE_CODE_OAUTH_TOKEN
# repository secret, as the other Claude workflows do.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: >-
      (
        (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
          contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review_comment' &&
          contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review' &&
          contains(github.event.review.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out WordInk
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install wordfreq==3.1.1

      # No `prompt`, so the action runs in tag mode: it checks out the PR's
      # branch, treats the comment as the task, keeps a progress comment
      # updated, and commits and pushes what it changes.
      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The run's own token, so the action does not need the Claude GitHub
          # App installed.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          trigger_phrase: "@claude"
          additional_permissions: |
            actions: read
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 100
            --allowedTools "Read,Write,Edit,MultiEdit,Glob,Grep,LS,WebFetch,WebSearch,Task,Agent,Bash"
            --append-system-prompt "You are working on WordInk in a GitHub Actions run, on the pull request's own branch. Read AGENTS.md for context, but ignore its worktree, branch, and new-PR steps: commit to this PR's branch. Before you push code changes, run npm run build, npm run lint, and the vitest tests relevant to what you changed, and fix what fails. Do not run prettier; the repo is not formatted with it. Never force-push, and never merge the pull request."
