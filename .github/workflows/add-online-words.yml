name: Add rare words found online

# Run this by hand (Actions tab -> "Add rare words found online" -> Run workflow).
# It looks at the drop coming up the following day, searches online (Datamuse)
# for very rare words that contain it, and opens ONE pull request adding all of
# them to the dictionary with the new "online" provenance -- distinct from
# "curated" (extra-words.txt) and "suggested" (suggested-words.txt). It reuses
# the exact same pipeline as the "Add a word" action:
# scripts/manage-extra-word.py add --list online, then a full data regen +
# legacy re-alignment + score pinning.
#
# Only words a frequency corpus attests are added (their rarity is measured, not
# guessed), so --forced is never used here.

on:
  workflow_dispatch:
    inputs:
      date:
        description: Target drop date (YYYY-MM-DD). Defaults to tomorrow (UTC).
        required: false
        type: string
      max_zipf:
        description: Only add words at or below this Zipf frequency (lower = rarer)
        required: false
        default: "2.5"
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  add-online-words:
    runs-on: ubuntu-latest
    steps:
      - name: Check out WordInk
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check out ESDB/SCOWL
        uses: actions/checkout@v4
        with:
          repository: en-wl/wordlist
          # Pinned so classification (proper-noun/abbreviation/etc.) can't
          # drift out from under pinned test counts between runs. Bump
          # deliberately, then regenerate and re-pin any counts that shift.
          ref: 1e5b7d3a72f47a71da5d28686c1dd4b397178485
          path: .tmp/esdb

      - name: Install data-generation dependency
        run: python -m pip install wordfreq==3.1.1

      - name: Find rare words for the upcoming drop
        id: find
        env:
          TARGET_DATE: ${{ inputs.date }}
          MAX_ZIPF: ${{ inputs.max_zipf }}
        run: |
          set -euo pipefail
          mkdir -p .tmp
          DATE_FLAG=""
          if [ -n "$TARGET_DATE" ]; then DATE_FLAG="--date $TARGET_DATE"; fi
          python scripts/find-online-words.py $DATE_FLAG \
            --max-zipf "${MAX_ZIPF:-2.5}" \
            --drop-out .tmp/drop.txt > .tmp/online-words.txt
          echo "drop=$(cat .tmp/drop.txt)" >> "$GITHUB_OUTPUT"
          echo "count=$(grep -c . .tmp/online-words.txt || true)" >> "$GITHUB_OUTPUT"
          {
            echo "words<<WORDS_EOF"
            cat .tmp/online-words.txt
            echo "WORDS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Report when nothing was found
        if: steps.find.outputs.count == '0'
        run: echo "No new rare words found for drop ${{ steps.find.outputs.drop }}; nothing to add."

      - name: Add words and regenerate dictionary data
        if: steps.find.outputs.count != '0'
        env:
          WORDS: ${{ steps.find.outputs.words }}
        run: |
          set -euo pipefail
          # Add each discovered word through the same path as the "Add a word"
          # action. No --forced: find-online-words.py only emits attested words.
          while IFS= read -r word; do
            [ -z "$word" ] && continue
            python scripts/manage-extra-word.py add "$word" --list online
          done <<< "$WORDS"

          make -C .tmp/esdb
          .tmp/esdb/scowl --db .tmp/esdb/scowl.db word-list 80 A,B,Z,C,D 1 --wo-poses=abbr --categories= > .tmp/scowl-regional-80.txt
          python scripts/generate-data.py --word-list .tmp/scowl-regional-80.txt --esdb-db .tmp/esdb/scowl.db
          # Grade the deep tail (Norvig/Google Books waterfall), then keep the
          # frozen legacy rarity arrays index-aligned with the grown dictionary
          # -- one align-legacy call inserts a placeholder for every added word.
          python scripts/generate-data.py --refresh-rarity
          python scripts/manage-extra-word.py align-legacy $WORDS
          python scripts/manage-extra-word.py update-size-test
          # Log each word's Zipf + rarity score and pin them in a test.
          while IFS= read -r word; do
            [ -z "$word" ] && continue
            python scripts/manage-extra-word.py record-word "$word" --list online
          done <<< "$WORDS"

      - name: Verify the added words are valid inputs
        if: steps.find.outputs.count != '0'
        run: |
          npm ci
          npm test -- --run src/game/dictionary.test.ts

      - name: Open pull request
        if: steps.find.outputs.count != '0'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automated/add-online-words-${{ github.run_id }}
          delete-branch: true
          commit-message: "Add ${{ steps.find.outputs.count }} online rare word(s) for the ${{ steps.find.outputs.drop }} drop"
          title: "Add online rare words for the ${{ steps.find.outputs.drop }} drop"
          body: |
            Adds rare words discovered online (via the Datamuse API) that contain
            the **${{ steps.find.outputs.drop }}** drop coming up the following day,
            to the new **online** provenance list (`scripts/online-words.txt`), and
            regenerates the dictionary and rarity mappings.

            Words added (all attested by a frequency corpus, so none are forced):

            ```
            ${{ steps.find.outputs.words }}
            ```

            - Each word's Zipf and rarity score are printed in the run log (see the
              "Add words and regenerate dictionary data" step) and pinned in a test.
            - The dictionary-size and validity/score tests were updated automatically.
            - `rarity-legacy.json` was re-aligned to the new dictionary length.
          add-paths: |
            scripts/online-words.txt
            src/data/dictionary.json
            src/data/rarity.json
            src/data/rarity-legacy.json
            src/data/rejection-metadata.json
            src/game/dictionary.test.ts
