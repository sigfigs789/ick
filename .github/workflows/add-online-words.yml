name: Add rare words found online

# Runs daily on a schedule, and can also be run by hand (Actions tab -> "Add rare
# words found online" -> Run workflow).
# It looks at the drop coming up the following day, searches online (Datamuse)
# for very rare words that contain it, and opens ONE pull request adding all of
# them to the dictionary with the new "online" provenance -- distinct from
# "curated" (extra-words.txt) and "suggested" (suggested-words.txt). It reuses
# the exact same pipeline as the "Add a word" action: scripts/manage-extra-word.py
# add --list online (which grows dictionary.json in place), then a rarity refresh
# over the grown list + legacy re-alignment + score pinning. It does not rebuild
# the dictionary from the ESDB/SCOWL source (see the note in add-word.yml).
#
# Only words a frequency corpus attests are added (their rarity is measured, not
# guessed), so --forced is never used here.

on:
  # 14:00 UTC is 08:00 MDT / 07:00 MST. The drop for a given puzzle date comes
  # from the player's *local* calendar date (src/game/date.ts), and this workflow
  # targets "tomorrow (UTC)" by default -- those agree only while the UTC and
  # Mountain dates match, which holds from 07:00 UTC to midnight year-round. A
  # mid-day-UTC cron therefore lands on tomorrow's Mountain drop in both DST
  # halves, a full day before it goes live; an overnight-UTC one would silently
  # target the wrong drop.
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: Target drop date (YYYY-MM-DD). Defaults to tomorrow (UTC).
        required: false
        type: string
      max_zipf:
        description: Only add words at or below this Zipf frequency (lower = rarer)
        required: false
        default: "2.5"
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  # Every run of this workflow edits dictionary.json, rarity.json and
  # rarity-legacy.json -- three index-aligned files whose conflicts have to be
  # resolved by hand. Two unreviewed PRs open at once means doing that, so a
  # scheduled run stands down until the previous one has been merged or closed.
  # A manual run is always deliberate, so it is never skipped.
  guard:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    permissions:
      pull-requests: read
    steps:
      - name: Check for an automated PR that is still open
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          open=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("automated/add-online-words-"))] | length')
          if [ "$open" = "0" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$open automated online-words PR(s) still open; skipping this scheduled run."
          fi

  add-online-words:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out WordInk
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install data-generation dependency
        run: python -m pip install wordfreq==3.1.1

      - name: Find rare words for the upcoming drop
        id: find
        env:
          TARGET_DATE: ${{ inputs.date }}
          MAX_ZIPF: ${{ inputs.max_zipf }}
        run: |
          set -euo pipefail
          mkdir -p .tmp
          DATE_FLAG=""
          if [ -n "$TARGET_DATE" ]; then DATE_FLAG="--date $TARGET_DATE"; fi
          python scripts/find-online-words.py $DATE_FLAG \
            --max-zipf "${MAX_ZIPF:-2.5}" \
            --drop-out .tmp/drop.txt > .tmp/online-words.txt
          echo "drop=$(cat .tmp/drop.txt)" >> "$GITHUB_OUTPUT"
          echo "count=$(grep -c . .tmp/online-words.txt || true)" >> "$GITHUB_OUTPUT"
          {
            echo "words<<WORDS_EOF"
            cat .tmp/online-words.txt
            echo "WORDS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Report when nothing was found
        if: steps.find.outputs.count == '0'
        run: echo "No new rare words found for drop ${{ steps.find.outputs.drop }}; nothing to add."

      - name: Add words and regenerate dictionary data
        if: steps.find.outputs.count != '0'
        env:
          WORDS: ${{ steps.find.outputs.words }}
        run: |
          set -euo pipefail
          # Add each discovered word through the same path as the "Add a word"
          # action. No --forced: find-online-words.py only emits attested words.
          while IFS= read -r word; do
            [ -z "$word" ] && continue
            python scripts/manage-extra-word.py add "$word" --list online
          done <<< "$WORDS"

          # Grow the dictionary by exactly the added words (manage-extra-word.py
          # inserts each into dictionary.json in place); we deliberately do NOT
          # rebuild the whole list from the ESDB/SCOWL source, whose unpinned
          # upstream made every run silently re-size and re-score the entire
          # dictionary and broke align-legacy. Grade the deep tail (wordfreq ->
          # Norvig -> Google Books waterfall; no ESDB needed), then keep the frozen
          # legacy rarity arrays index-aligned with the grown dictionary -- one
          # align-legacy call inserts a placeholder for every added word.
          python scripts/generate-data.py --refresh-rarity
          python scripts/manage-extra-word.py align-legacy $WORDS
          python scripts/manage-extra-word.py update-size-test
          # Log each word's Zipf + rarity score and pin them in a test.
          while IFS= read -r word; do
            [ -z "$word" ] && continue
            python scripts/manage-extra-word.py record-word "$word" --list online
          done <<< "$WORDS"

      - name: Verify the added words are valid inputs
        if: steps.find.outputs.count != '0'
        run: |
          npm ci
          npm test -- --run src/game/dictionary.test.ts

      - name: Open pull request
        if: steps.find.outputs.count != '0'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automated/add-online-words-${{ github.run_id }}
          delete-branch: true
          commit-message: "Add ${{ steps.find.outputs.count }} online rare word(s) for the ${{ steps.find.outputs.drop }} drop"
          title: "Add online rare words for the ${{ steps.find.outputs.drop }} drop"
          body: |
            Adds rare words discovered online (via the Datamuse API) that contain
            the **${{ steps.find.outputs.drop }}** drop coming up the following day,
            to the new **online** provenance list (`scripts/online-words.txt`), and
            regenerates the dictionary and rarity mappings.

            Words added (all attested by a frequency corpus, so none are forced):

            ```
            ${{ steps.find.outputs.words }}
            ```

            - Each word's Zipf and rarity score are printed in the run log (see the
              "Add words and regenerate dictionary data" step) and pinned in a test.
            - The dictionary-size and validity/score tests were updated automatically.
            - `rarity-legacy.json` was re-aligned to the new dictionary length.
          add-paths: |
            scripts/online-words.txt
            src/data/dictionary.json
            src/data/rarity.json
            src/data/rarity-legacy.json
            src/data/rejection-metadata.json
            src/game/dictionary.test.ts
