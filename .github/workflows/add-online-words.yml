name: Add rare words found online

# Run this by hand (Actions tab -> "Add rare words found online" -> Run workflow).
# It looks at the drop coming up the following day, searches online (Datamuse)
# for very rare words that contain it, and opens ONE pull request PER WORD so
# each candidate can be reviewed and approved on its own. Every PR adds a single
# word to the new "online" provenance list (scripts/online-words.txt) -- distinct
# from "curated" (extra-words.txt) and "suggested" (suggested-words.txt) -- and
# reuses the exact same pipeline as the "Add a word" action:
# scripts/manage-extra-word.py add --list online, then a full data regen +
# legacy re-alignment + score pinning.
#
# Only words a frequency corpus attests are added (their rarity is measured, not
# guessed), so --forced is never used here. Each candidate is also run through
# scripts/word_tags.py (Wiktextract + Merriam-Webster + Datamuse), which drops
# proper nouns, abbreviations, and out-of-use words (obsolete/archaic/dated).
#
# NOTE: because every PR regenerates the shared data files, merging one makes the
# others stale (dictionary length, size test, legacy alignment). Merge them one
# at a time and re-run this workflow, or rebase/regenerate the remaining PRs.

on:
  workflow_dispatch:
    inputs:
      date:
        description: Target drop date (YYYY-MM-DD). Defaults to tomorrow (UTC).
        required: false
        type: string
      max_zipf:
        description: Only add words at or below this Zipf frequency (lower = rarer)
        required: false
        default: "2.5"
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  # Resolve the upcoming drop and discover the rare candidates once, then hand
  # the list to a fan-out matrix so each word gets its own job and its own PR.
  discover:
    runs-on: ubuntu-latest
    outputs:
      words: ${{ steps.find.outputs.words }}
      drop: ${{ steps.find.outputs.drop }}
      count: ${{ steps.find.outputs.count }}
    steps:
      - name: Check out WordInk
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install data-generation dependency
        run: python -m pip install wordfreq==3.1.1

      - name: Find rare words for the upcoming drop
        id: find
        env:
          TARGET_DATE: ${{ inputs.date }}
          MAX_ZIPF: ${{ inputs.max_zipf }}
          # Per-word lexical tagging (proper noun / abbreviation / out-of-use).
          # If unset, word_tags.py falls back to Wiktextract + Datamuse.
          MW_COLLEGIATE_KEY: ${{ secrets.MW_COLLEGIATE_KEY }}
          MW_MEDICAL_KEY: ${{ secrets.MW_MEDICAL_KEY }}
        run: |
          set -euo pipefail
          mkdir -p .tmp
          DATE_FLAG=""
          if [ -n "$TARGET_DATE" ]; then DATE_FLAG="--date $TARGET_DATE"; fi
          python scripts/find-online-words.py $DATE_FLAG \
            --max-zipf "${MAX_ZIPF:-2.5}" \
            --drop-out .tmp/drop.txt > .tmp/online-words.txt
          echo "drop=$(cat .tmp/drop.txt)" >> "$GITHUB_OUTPUT"
          echo "count=$(grep -c . .tmp/online-words.txt || true)" >> "$GITHUB_OUTPUT"
          # Emit the discovered words as a JSON array for the matrix below.
          words_json=$(jq -R -s -c 'split("\n") | map(select(length > 0))' < .tmp/online-words.txt)
          echo "words=$words_json" >> "$GITHUB_OUTPUT"

      - name: Report when nothing was found
        if: steps.find.outputs.count == '0'
        run: echo "No new rare words found for drop ${{ steps.find.outputs.drop }}; nothing to add."

  # One job -- and therefore one PR -- per discovered word. fail-fast: false so a
  # single failing word doesn't cancel the rest.
  add-word:
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        word: ${{ fromJson(needs.discover.outputs.words) }}
    env:
      WORD: ${{ matrix.word }}
      DROP: ${{ needs.discover.outputs.drop }}
      # manage-extra-word.py add re-checks the word via word_tags.py; give it the
      # MW keys too. Falls back to Wiktextract + Datamuse when unset.
      MW_COLLEGIATE_KEY: ${{ secrets.MW_COLLEGIATE_KEY }}
      MW_MEDICAL_KEY: ${{ secrets.MW_MEDICAL_KEY }}
    steps:
      - name: Check out WordInk
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check out ESDB/SCOWL
        uses: actions/checkout@v4
        with:
          repository: en-wl/wordlist
          path: .tmp/esdb

      - name: Install data-generation dependency
        run: python -m pip install wordfreq==3.1.1

      - name: Add the word and regenerate dictionary data
        run: |
          set -euo pipefail
          # Add this one word through the same path as the "Add a word" action.
          # No --forced: find-online-words.py only emits attested words.
          python scripts/manage-extra-word.py add "$WORD" --list online

          make -C .tmp/esdb
          .tmp/esdb/scowl --db .tmp/esdb/scowl.db word-list 80 A,B,Z,C,D 1 --wo-poses=abbr --categories= > .tmp/scowl-regional-80.txt
          python scripts/generate-data.py --word-list .tmp/scowl-regional-80.txt --esdb-db .tmp/esdb/scowl.db
          # Grade the deep tail (Norvig/Google Books waterfall), then keep the
          # frozen legacy rarity arrays index-aligned with the grown dictionary.
          python scripts/generate-data.py --refresh-rarity
          python scripts/manage-extra-word.py align-legacy "$WORD"
          python scripts/manage-extra-word.py update-size-test
          # Log the word's Zipf + rarity score and pin them in a test.
          python scripts/manage-extra-word.py record-word "$WORD" --list online

      - name: Verify the added word is a valid input
        run: |
          npm ci
          npm test -- --run src/game/dictionary.test.ts

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automated/add-online-word-${{ matrix.word }}-${{ github.run_id }}
          delete-branch: true
          commit-message: "Add ${{ matrix.word }} to the online dictionary"
          title: "Add ${{ matrix.word }} to the online dictionary (${{ needs.discover.outputs.drop }} drop)"
          body: |
            Adds the rare word `${{ matrix.word }}` -- discovered online (via the
            Datamuse API) as containing the **${{ needs.discover.outputs.drop }}**
            drop coming up the following day -- to the new **online** provenance
            list (`scripts/online-words.txt`), and regenerates the dictionary and
            rarity mappings.

            - Attested by a frequency corpus, so it is not forced.
            - The word's Zipf and rarity score are printed in the run log (see the
              "Add the word and regenerate dictionary data" step) and pinned in a test.
            - The dictionary-size and validity/score tests were updated automatically.
            - `rarity-legacy.json` was re-aligned to the new dictionary length.

            One word per PR: merging this makes any sibling online-word PRs stale
            (shared data files), so re-run the workflow or rebase the rest after merge.
          add-paths: |
            scripts/online-words.txt
            src/data/dictionary.json
            src/data/rarity.json
            src/data/rarity-legacy.json
            src/data/rejection-metadata.json
            src/game/dictionary.test.ts
