name: Estimate unattested Zipf

# Every day, Claude guesses a frequency for the words the puzzle two days out can
# accept that no frequency corpus measures -- the words that would otherwise
# score the unattested sentinel, a flat 10.00 Legend -- and opens ONE pull
# request recording the guesses in src/data/estimated-zipf.json.
#
#   1. scripts/unattested-candidates.mts runs every curated and corpus word that
#      contains the drop through the game's own evaluateSubmission, in both
#      modes, and keeps the ones accepted on a sentinel Zipf of their own. It
#      also picks measured words with the same drops as calibration anchors.
#   2. `scripts/estimate-zipf.py prepare` picks at most `limit` of them (1,000
#      unless a manual run says otherwise; the likeliest to be played first, see
#      `priority`) and writes Claude's request -- one for up to 1,000 words, so
#      the daily run is a single request and only a bigger manual sweep is more.
#   3. Claude Code, on the CLI, answers each request in turn, writing its
#      estimates and a one-line reason per word to .tmp/answers/ (in several
#      files if one answer is too long to write at once).
#   4. `scripts/estimate-zipf.py record` keeps the well-formed estimates for the
#      words asked about and appends them as one batch: the model, this run's
#      URL, the drops, and the puzzle date as `since`. Nothing marks an estimate
#      as anything but a guess, and nothing re-prices an earlier puzzle.
#   5. scripts/estimated-scores.mts scores every estimated word through the
#      game's own code with the batch applied, and `estimate-zipf.py summary`
#      writes the PR body: every word players have already banked at 10.00,
#      then a sample of 100 of the rest, each with its Zipf, the score Standard
#      and Freeform will show and Claude's reasoning. The full list is the diff.
#
# Two days ahead so the PR has a day to merge: the batch applies from its
# puzzle's date on, and a puzzle two days out by UTC has not started anywhere
# yet. Merge it before that date, or it re-prices a puzzle being played.
#
# A sweep is the same run, wider: `days` covers the drops of that many puzzles
# from `date` on, `words_file` adds a committed list of words players have
# already banked at 10.00 (word, a tab, anything), and a higher `limit` lets
# more of them through. Everything it records still applies from `date` on.
#
#   gh workflow run estimate-unattested-zipf.yml --repo sigfigs789/ick -f date=2026-10-12
#   gh workflow run estimate-unattested-zipf.yml --repo sigfigs789/ick \
#     -f date=2026-10-09 -f days=14 -f limit=3000 -f words_file=scripts/played-unattested-words.txt
#
# Runs on the Claude subscription, as sigfigs789/krausen's Claude workflows do:
# it needs a CLAUDE_CODE_OAUTH_TOKEN repository secret (Settings -> Secrets ->
# Actions), made with `claude setup-token`. Without it the job says so and stops.
#
# The PR is opened with the built-in GITHUB_TOKEN, so "Test" does not run on it
# on its own; this job runs the checks itself.

on:
  schedule:
    # Off the hour, and a few minutes after the fold check: GitHub drops :00
    # schedules under load (the first one, 2026-10-07, never fired).
    - cron: "23 14 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: Puzzle date (YYYY-MM-DD). Defaults to two days from today (UTC).
        required: false
        type: string
      model:
        description: Claude model to estimate with
        required: false
        default: claude-opus-5-5
        type: choice
        options:
          - claude-opus-5-5
          - claude-sonnet-5
          - claude-fable-5-1
      limit:
        description: Most words to estimate (the likeliest to be played go first)
        required: false
        default: "1000"
        type: string
      days:
        description: Sweep the drops of this many puzzles from the date on
        required: false
        default: "1"
        type: string
      words_file:
        description: Also estimate the words in this committed file (one per line), e.g. scripts/played-unattested-words.txt
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: estimate-unattested-zipf
  cancel-in-progress: false

jobs:
  estimate:
    runs-on: ubuntu-latest
    # A sweep runs one Claude request per 1,000 words, one after another.
    timeout-minutes: 330
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      MODEL: ${{ inputs.model || 'claude-opus-5-5' }}

    steps:
      - name: Check for the Claude subscription token
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::Add a CLAUDE_CODE_OAUTH_TOKEN repository secret (from \`claude setup-token\`) first."
            exit 1
          fi

      - name: Check out WordInk
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Pick the puzzle
        id: puzzle
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail
          date="${INPUT_DATE:-$(date -u -d '+2 days' +%F)}"
          if ! [[ "$date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::date must be YYYY-MM-DD, got '$date'"
            exit 1
          fi
          # Tomorrow by UTC is already today in Kiribati, so anything before
          # two days out could re-price a puzzle somebody is playing.
          if [[ "$date" < "$(date -u -d '+2 days' +%F)" ]]; then
            echo "::error::$date is too soon: a batch must be for a puzzle no time zone has reached."
            exit 1
          fi
          echo "date=$date" >> "$GITHUB_OUTPUT"

      - name: Find the unattested words the puzzles accept
        id: find
        env:
          DAYS: ${{ inputs.days || '1' }}
          WORDS_FILE: ${{ inputs.words_file }}
        run: |
          set -euo pipefail
          mkdir -p .tmp
          words=()
          if [ -n "$WORDS_FILE" ]; then
            [ -f "$WORDS_FILE" ] || { echo "::error::words_file $WORDS_FILE is not in the repo"; exit 1; }
            words=(--words "$WORDS_FILE")
          fi
          ./node_modules/.bin/vite-node scripts/unattested-candidates.mts -- \
            --date "${{ steps.puzzle.outputs.date }}" --days "$DAYS" "${words[@]}" --out .tmp/candidates.json
          echo "drop=$(jq -r .drop .tmp/candidates.json)" >> "$GITHUB_OUTPUT"
          echo "count=$(jq -r .count .tmp/candidates.json)" >> "$GITHUB_OUTPUT"
          if [ "$DAYS" = "1" ] && [ -z "$WORDS_FILE" ]; then
            echo "sweep=" >> "$GITHUB_OUTPUT"
          else
            echo "sweep=-sweep" >> "$GITHUB_OUTPUT"
          fi

      - name: Pick the words and write Claude's requests
        if: steps.find.outputs.count != '0'
        run: |
          python scripts/estimate-zipf.py prepare \
            --candidates .tmp/candidates.json \
            --limit "${{ inputs.limit || '1000' }}" \
            --chunk-size 1000 \
            --asked-out .tmp/asked.json \
            --requests-dir .tmp/requests \
            --answers-dir .tmp/answers

      - name: Install Claude Code
        if: steps.find.outputs.count != '0'
        # The runner image ships an older `claude` ahead of npm's global bin on
        # PATH (2.1.197, which the API refuses for Opus 5.5), so put the fresh
        # install first and print what the next step will actually run.
        run: |
          npm install -g @anthropic-ai/claude-code@latest
          echo "$(npm prefix -g)/bin" >> "$GITHUB_PATH"
          which -a claude
          "$(npm prefix -g)/bin/claude" --version

      - name: Estimate their Zipf with Claude
        if: steps.find.outputs.count != '0'
        run: |
          set -uo pipefail
          claude --version
          mkdir -p .tmp/answers .tmp/logs
          # One request at a time. A request that fails is skipped -- its words
          # come out as having no estimate -- but three failures in a row (a
          # usage limit, an outage) stop the loop rather than burn the rest.
          failures=0
          for request in .tmp/requests/request-*.md; do
            n=$(basename "$request" .md)
            echo "::group::$n"
            if claude -p "Read $request and do exactly what it asks. Do not change any other file and do not run git or gh." \
                --model "$MODEL" --max-turns 40 \
                --allowedTools "Read,Write,WebSearch,WebFetch" \
                > ".tmp/logs/$n.log" 2>&1; then
              failures=0
            else
              failures=$((failures + 1))
              echo "::warning::$n failed: $(tail -c 500 ".tmp/logs/$n.log")"
            fi
            echo "::endgroup::"
            if [ "$failures" -ge 3 ]; then
              echo "::warning::Three requests failed in a row; recording what came back."
              break
            fi
          done
          ls .tmp/answers

      - name: Record the estimates
        if: steps.find.outputs.count != '0'
        run: |
          python scripts/estimate-zipf.py record \
            --asked .tmp/asked.json \
            --estimates .tmp/answers/*.json \
            --model "$MODEL" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Score the estimated words as the game will show them
        if: steps.find.outputs.count != '0'
        run: |
          ./node_modules/.bin/vite-node scripts/estimated-scores.mts -- \
            --asked .tmp/asked.json --out .tmp/scores.json

      - name: Write the summary
        if: steps.find.outputs.count != '0'
        run: |
          python scripts/estimate-zipf.py summary \
            --asked .tmp/asked.json \
            --estimates .tmp/answers/*.json \
            --scores .tmp/scores.json \
            --model "$MODEL" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --summary-out .tmp/summary.md
          cat .tmp/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the estimates load and score
        if: steps.find.outputs.count != '0'
        run: |
          npx vitest run src/game/estimated-zipf.test.ts
          npm run build

      - name: Read the summary
        id: summary
        if: steps.find.outputs.count != '0'
        run: |
          {
            echo "body<<SUMMARY_EOF"
            cat .tmp/summary.md
            echo
            echo "🤖 Generated with [Claude Code](https://claude.com/claude-code)"
            echo "SUMMARY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open pull request
        id: pr
        if: steps.find.outputs.count != '0'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: automated/estimate-zipf-${{ steps.puzzle.outputs.date }}${{ steps.find.outputs.sweep }}
          delete-branch: true
          commit-message: "Estimate Zipf for unattested words from ${{ steps.puzzle.outputs.date }} (${{ steps.find.outputs.drop }})"
          title: "Estimate Zipf for unattested words from ${{ steps.puzzle.outputs.date }} (${{ steps.find.outputs.drop }})"
          body: ${{ steps.summary.outputs.body }}
          add-paths: |
            src/data/estimated-zipf.json

      - name: Report the result
        env:
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: |
          if [ -n "$PR_URL" ]; then
            echo "Opened $PR_URL" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "No PR for ${{ steps.puzzle.outputs.date }}: nothing unattested left to estimate, or no estimate came back." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
