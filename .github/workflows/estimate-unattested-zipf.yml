name: Estimate unattested Zipf

# Every day, Claude guesses a frequency for the words the puzzle two days out can
# accept that no frequency corpus measures -- the words that would otherwise
# score the unattested sentinel, a flat 10.00 Legend -- and opens ONE pull
# request recording the guesses in src/data/estimated-zipf.json.
#
#   1. scripts/unattested-candidates.mts runs every curated and corpus word that
#      contains the drop through the game's own evaluateSubmission, in both
#      modes, and keeps the ones accepted on a sentinel Zipf of their own. It
#      also picks measured words with the same drop as calibration anchors.
#   2. scripts/estimate-zipf.py hands them to Claude in batches and appends one
#      batch to the data file: the model, this run's URL, the drop, and the
#      puzzle date as `since`. Nothing marks an estimate as anything but a guess,
#      and nothing re-prices an earlier puzzle.
#
# Two days ahead so the PR has a day to merge: the batch applies from its
# puzzle's date on, and a puzzle two days out by UTC has not started anywhere
# yet. Merge it before that date, or it re-prices a puzzle being played.
#
# Run it by hand for another date (Actions tab -> "Estimate unattested Zipf" ->
# Run workflow), or:
#
#   gh workflow run estimate-unattested-zipf.yml --repo sigfigs789/ick -f date=2026-10-12
#
# Needs an ANTHROPIC_API_KEY repository secret (Settings -> Secrets -> Actions);
# it calls the Messages API directly, so a Claude Code OAuth token will not do.
#
# The PR is opened with the built-in GITHUB_TOKEN, so "Test" does not run on it
# on its own; this job runs the checks itself.

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: Puzzle date (YYYY-MM-DD). Defaults to two days from today (UTC).
        required: false
        type: string
      model:
        description: Claude model to estimate with
        required: false
        default: claude-opus-5-5
        type: choice
        options:
          - claude-opus-5-5
          - claude-sonnet-5-5
          - claude-haiku-4-5
      max_words:
        description: Stop without spending if a drop reaches more words than this
        required: false
        default: "12000"
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: estimate-unattested-zipf
  cancel-in-progress: false

jobs:
  estimate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Check for an Anthropic API key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Add an ANTHROPIC_API_KEY repository secret first."
            exit 1
          fi

      - name: Check out WordInk
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install anthropic==1.11.0

      - name: Pick the puzzle
        id: puzzle
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail
          date="${INPUT_DATE:-$(date -u -d '+2 days' +%F)}"
          if ! [[ "$date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::date must be YYYY-MM-DD, got '$date'"
            exit 1
          fi
          # Tomorrow by UTC is already today in Kiribati, so anything before
          # two days out could re-price a puzzle somebody is playing.
          if [[ "$date" < "$(date -u -d '+2 days' +%F)" ]]; then
            echo "::error::$date is too soon: a batch must be for a puzzle no time zone has reached."
            exit 1
          fi
          echo "date=$date" >> "$GITHUB_OUTPUT"

      - name: Find the unattested words the puzzle accepts
        id: find
        run: |
          set -euo pipefail
          mkdir -p .tmp
          ./node_modules/.bin/vite-node scripts/unattested-candidates.mts -- \
            --date "${{ steps.puzzle.outputs.date }}" --out .tmp/candidates.json
          echo "drop=$(jq -r .drop .tmp/candidates.json)" >> "$GITHUB_OUTPUT"
          echo "count=$(jq -r .count .tmp/candidates.json)" >> "$GITHUB_OUTPUT"

      - name: Estimate their Zipf with Claude
        if: steps.find.outputs.count != '0'
        run: |
          python scripts/estimate-zipf.py \
            --candidates .tmp/candidates.json \
            --model "${{ inputs.model || 'claude-opus-5-5' }}" \
            --max-words "${{ inputs.max_words || '12000' }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --summary-out .tmp/summary.md
          cat .tmp/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the estimates load and score
        if: steps.find.outputs.count != '0'
        run: |
          npx vitest run src/game/estimated-zipf.test.ts
          npm run build

      - name: Read the summary
        id: summary
        if: steps.find.outputs.count != '0'
        run: |
          {
            echo "body<<SUMMARY_EOF"
            cat .tmp/summary.md
            echo
            echo "🤖 Generated with [Claude Code](https://claude.com/claude-code)"
            echo "SUMMARY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open pull request
        id: pr
        if: steps.find.outputs.count != '0'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: automated/estimate-zipf-${{ steps.puzzle.outputs.date }}
          delete-branch: true
          commit-message: "Estimate Zipf for the ${{ steps.find.outputs.drop }} drop's unattested words (${{ steps.puzzle.outputs.date }})"
          title: "Estimate Zipf for the ${{ steps.find.outputs.drop }} drop's unattested words (${{ steps.puzzle.outputs.date }})"
          body: ${{ steps.summary.outputs.body }}
          add-paths: |
            src/data/estimated-zipf.json

      - name: Report the result
        env:
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: |
          if [ -n "$PR_URL" ]; then
            echo "Opened $PR_URL" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Nothing unattested left to estimate for ${{ steps.puzzle.outputs.date }}." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
