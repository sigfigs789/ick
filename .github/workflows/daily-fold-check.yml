name: Daily fold check

# Every morning, checks the next puzzle nobody has checked yet -- the one after
# the last checked date, and never closer than three days out (Mountain Time) --
# for answers whose Standard-mode fold lands on a word of a different meaning --
# `rehearse` scored as `hearse`, `scowly` as `scow` -- and opens a draft PR
# fixing them.
#
#   1. scripts/fold-audit/dump-folds.ts lists every playable answer for that
#      day's drop whose fold lowers its score. Only that drop's answers: each
#      word goes through the real submission gate.
#   2. Claude judges each fold against scripts/fold-audit/RUBRIC.md, then a
#      second pass defends every flag (scripts/fold-audit/DAILY.md). Only the
#      flags that survive are applied -- the detector alone over-flags ~2x.
#   3. Where the judge named the form the word really comes from (`scowly` ->
#      `scowl`) and both passes agreed, price-bases.ts looks that base up. If
#      it already has a measured score, apply-daily.py redirects the fold there
#      in fold-review-verdicts.json; otherwise -- no base, or one no corpus
#      measures -- it exempts the word in fold-exemptions.json. Both are dated
#      from that puzzle, and daily-report.ts tables each word, its fold, and its
#      score before and after for the PR body.
#
#   4. A second job hands the PR to claude-review-fold-pr.yml, which comments
#      "approve" or "decline" and labels the PR to match. It does not merge.
#
# scripts/fold-audit/checked-through.txt holds the last puzzle date whose folds
# were checked, by this workflow or by hand several drops at once. Every run
# moves it forward in its PR -- a run with nothing to fix still opens one, so the
# date is recorded -- and the next run starts after the latest of that file on
# main and on any open fold-check PR. Run it by hand for a particular date with:
#
#   gh workflow run daily-fold-check.yml --repo sigfigs789/ick -f date=2026-10-08
#
# Runs on the Claude subscription, as sigfigs789/krausen's Claude workflows do:
# it needs a CLAUDE_CODE_OAUTH_TOKEN repository secret (Settings -> Secrets ->
# Actions), made with `claude setup-token`. Without it the job says so and stops.
# The PR is opened with GITHUB_TOKEN, so "Test" does
# not start on it by itself; the build and fold tests run here instead.

on:
  schedule:
    # 14:17 UTC is 7-8am in Denver, so the three-day floor is the same puzzle
    # whichever side of DST it is. Off the hour because GitHub drops :00
    # schedules under load (the first one, 2026-10-07, never fired).
    - cron: "17 14 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: Puzzle date (YYYY-MM-DD). Defaults to three days from today, Mountain Time.
        required: false
        type: string
      model:
        description: Claude model to use
        required: false
        default: claude-opus-5-5
        type: choice
        options:
          - claude-opus-5-5
          - claude-sonnet-5-5
          - claude-fable-5-1

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: daily-fold-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      pr: ${{ steps.pr.outputs.pull-request-number }}
      applied: ${{ steps.apply.outputs.applied }}
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

    steps:
      - name: Check for the Claude subscription token
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::Add a CLAUDE_CODE_OAUTH_TOKEN repository secret (from \`claude setup-token\`) first."
            exit 1
          fi

      - name: Check out WordInk
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pick the puzzle
        id: puzzle
        env:
          INPUT_DATE: ${{ inputs.date }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ledger=scripts/fold-audit/checked-through.txt
          if [ -n "$INPUT_DATE" ]; then
            date="$INPUT_DATE"
          else
            # The latest checked date: main's, or one an open fold-check PR has
            # recorded but nobody has merged yet.
            through="$(tr -d '[:space:]' < "$ledger")"
            for branch in $(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
                --json headRefName -q '.[].headRefName | select(startswith("codex/fold-check-"))'); do
              theirs="$(gh api "repos/$GITHUB_REPOSITORY/contents/$ledger?ref=$branch" \
                -H "Accept: application/vnd.github.raw" 2>/dev/null | tr -d '[:space:]' || true)"
              if [[ "$theirs" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ && "$theirs" > "$through" ]]; then
                through="$theirs"
              fi
            done
            date="$(date -d "$through +1 day" +%F)"
            floor="$(TZ=America/Denver date -d '+3 days' +%F)"
            if [[ "$floor" > "$date" ]]; then date="$floor"; fi
            echo "Checked through $through; checking $date." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          if ! [[ "$date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::Bad date '$date'; use YYYY-MM-DD."
            exit 1
          fi
          echo "date=$date" >> "$GITHUB_OUTPUT"

      - name: Dump the drop's folds
        id: dump
        env:
          DATE: ${{ steps.puzzle.outputs.date }}
        run: |
          set -euo pipefail
          ./node_modules/.bin/vite-node scripts/fold-audit/dump-folds.ts -- "$DATE"
          out=scripts/fold-audit/out
          mkdir -p "$out/daily/chunks"
          # word|path|score with the fold|score without it|rule, 250 to a chunk.
          tail -n +2 "$out/folds.tsv" \
            | awk -F'\t' '{ print $3 "|" $7 "|" $11 "|" $10 "|" $5 }' \
            | split -l 250 -d -a 2 --additional-suffix=.txt - "$out/daily/chunks/chunk-"
          drop="$(awk -F'\t' 'NR == 2 { print $2 }' "$out/folds.tsv")"
          count="$(tail -n +2 "$out/folds.tsv" | grep -c . || true)"
          echo "drop=$drop" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "$DATE \`$drop\`: $count score-lowering folds to judge" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Judge the folds
        if: steps.dump.outputs.count != '0'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: >-
            --model ${{ inputs.model || 'claude-opus-5-5' }}
            --max-turns 150
            --allowedTools "Read,Write,Glob,Grep,LS,Task,Agent"
          prompt: |
            You are running WordInk's daily fold check for the
            ${{ steps.puzzle.outputs.date }} puzzle, drop
            `${{ steps.dump.outputs.drop }}`, in GitHub Actions.

            Follow scripts/fold-audit/DAILY.md exactly. The chunks are in
            scripts/fold-audit/out/daily/chunks/. Judge every row, then write
            scripts/fold-audit/out/daily/flagged.tsv and
            scripts/fold-audit/out/daily/confirmed.tsv.

            Run every subagent in the foreground (run_in_background: false)
            and do not end your turn until both files are written: this is a
            headless run, so ending the turn kills any subagent still working.

            Do not edit any other file, and do not run git or gh -- the
            workflow applies your verdicts and opens the pull request.

      - name: Price the named bases
        if: steps.dump.outputs.count != '0'
        env:
          DATE: ${{ steps.puzzle.outputs.date }}
        run: ./node_modules/.bin/vite-node scripts/fold-audit/price-bases.ts -- "$DATE"

      - name: Apply the confirmed folds
        id: apply
        if: steps.dump.outputs.count != '0'
        env:
          DATE: ${{ steps.puzzle.outputs.date }}
        run: |
          set -euo pipefail
          python3 scripts/fold-audit/apply-daily.py --date "$DATE"
          applied="$(grep -c . scripts/fold-audit/out/daily/applied.txt || true)"
          redirected="$(grep -c . scripts/fold-audit/out/daily/redirected.txt || true)"
          echo "applied=$applied" >> "$GITHUB_OUTPUT"
          echo "redirected=$redirected" >> "$GITHUB_OUTPUT"

      - name: Build the report
        if: steps.apply.outputs.applied != '' && steps.apply.outputs.applied != '0'
        env:
          DATE: ${{ steps.puzzle.outputs.date }}
        run: ./node_modules/.bin/vite-node scripts/fold-audit/daily-report.ts -- "$DATE"

      # A red check here still opens the PR, with the failure at the top of it --
      # the verdicts are the expensive part and should not be thrown away.
      - name: Build and test
        id: checks
        if: steps.apply.outputs.applied != '' && steps.apply.outputs.applied != '0'
        continue-on-error: true
        run: |
          set -eo pipefail
          npm run build 2>&1 | tail -n 40
          npx vitest run src/game/ 2>&1 | tail -n 60

      # Only once the check has finished -- nothing to judge, or the verdicts
      # applied -- and never backwards, for a run by hand on an earlier date.
      - name: Record the checked date
        id: record
        if: steps.dump.outputs.count == '0' || steps.apply.outcome == 'success'
        env:
          DATE: ${{ steps.puzzle.outputs.date }}
        run: |
          ledger=scripts/fold-audit/checked-through.txt
          if [[ "$DATE" > "$(tr -d '[:space:]' < "$ledger")" ]]; then
            echo "$DATE" > "$ledger"
          fi
          applied="${{ steps.apply.outputs.applied }}"
          if [ -n "$applied" ] && [ "$applied" != "0" ]; then
            echo "title=Fix $applied wrong folds from the $DATE puzzle (${{ steps.dump.outputs.drop }})" >> "$GITHUB_OUTPUT"
          else
            echo "title=Fold check: no wrong folds on the $DATE puzzle (${{ steps.dump.outputs.drop }})" >> "$GITHUB_OUTPUT"
          fi

      - name: Read the report
        id: report
        if: steps.record.outcome == 'success'
        env:
          CHECKS: ${{ steps.checks.outcome }}
          DATE: ${{ steps.puzzle.outputs.date }}
        run: |
          {
            echo "body<<FOLD_PR_EOF"
            if [ "$CHECKS" = "failure" ]; then
              echo "> [!WARNING]"
              echo "> \`npm run build\` or \`vitest run src/game/\` failed on this change; see the run log."
              echo
            fi
            if [ -f scripts/fold-audit/out/daily/pr-body.md ]; then
              cat scripts/fold-audit/out/daily/pr-body.md
            else
              echo "Daily fold check for the **$DATE** puzzle: no fold was confirmed wrong, so nothing changes but \`scripts/fold-audit/checked-through.txt\`, which records the date as checked."
            fi
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "🤖 Generated with [Claude Code](https://claude.com/claude-code)"
            echo "FOLD_PR_EOF"
          } >> "$GITHUB_OUTPUT"
          cat scripts/fold-audit/out/daily/pr-body.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Open draft pull request
        id: pr
        if: steps.record.outcome == 'success'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: codex/fold-check-${{ steps.puzzle.outputs.date }}
          delete-branch: true
          draft: true
          add-paths: |
            src/data/fold-exemptions.json
            src/data/fold-review-verdicts.json
            scripts/fold-audit/checked-through.txt
          commit-message: ${{ steps.record.outputs.title }}
          title: ${{ steps.record.outputs.title }}
          body: ${{ steps.report.outputs.body }}

      - name: Report the result
        if: always()
        env:
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: |
          if [ -n "$PR_URL" ]; then
            echo "Opened $PR_URL" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "No pull request was opened; see the steps above." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  review:
    needs: check
    if: needs.check.outputs.pr != '' && needs.check.outputs.applied != '' && needs.check.outputs.applied != '0'
    uses: ./.github/workflows/claude-review-fold-pr.yml
    with:
      pr: ${{ fromJSON(needs.check.outputs.pr) }}
      model: ${{ inputs.model || 'claude-opus-5-5' }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
