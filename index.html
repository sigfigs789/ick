<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicons / app icons -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121213" media="(prefers-color-scheme: dark)" />

    <title>WordInk — find the rarest word each day</title>
    <meta
      name="description"
      content="WordInk is a daily game about finding rare words: everyone gets the same drop, and you find the rarest word you can that contains it. No timer, no login — just a daily vocabulary challenge inspired by Wordle."
    />
    <link rel="canonical" href="https://wordink.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WordInk" />
    <meta property="og:title" content="WordInk — find the rarest word each day" />
    <meta
      property="og:description"
      content="Every day, everyone gets the same few letters — say INK. Find the rarest word you can that contains them, like wrinkle or inkling, in four guesses."
    />
    <meta property="og:url" content="https://www.wordink.app/" />
    <meta property="og:image" content="https://www.wordink.app/og-image.png?v=3" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WordInk — find the rarest word each day" />
    <meta
      name="twitter:description"
      content="Every day, everyone gets the same few letters — say INK. Find the rarest word you can that contains them, like wrinkle or inkling, in four guesses."
    />
    <meta name="twitter:image" content="https://www.wordink.app/og-image.png?v=3" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,400;0,500;0,700;0,800;1,400&family=Libre+Franklin:wght@600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Game",
        "name": "WordInk",
        "url": "https://wordink.app/",
        "description": "A daily game where you find the rarest word you can: everyone gets the same few letters, and hunts for the rarest word that contains them.",
        "genre": "Word game",
        "applicationCategory": "Game",
        "operatingSystem": "Any (web browser)",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
  </head>
  <body>
    <div id="root">
      <!--
        Static fallback for crawlers/clients that don't run JS. React's
        createRoot() replaces this on mount, but that happens after the
        page paints, so it's visually hidden (not display:none, which
        some crawlers ignore the content of) to avoid a flash of this
        text before the app takes over.
      -->
      <main style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;">
        <h1>WordInk</h1>
        <p>
          A daily game where you find the rarest word you can. Every player
          gets the same 2- or 3-letter drop each day and enters valid English
          words that contain it, in order, for up to 4 distinct guesses. The
          rarer the word, the better the result.
        </p>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
