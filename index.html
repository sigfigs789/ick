<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicons / app icons -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121213" media="(prefers-color-scheme: dark)" />

    <title>WordInk — find the rarest word each day</title>
    <meta
      name="description"
      content="WordInk is a daily game about finding rare words: everyone gets the same drop, and you find the rarest word you can that contains it. No timer, no login — just a daily vocabulary challenge inspired by Wordle."
    />
    <link rel="canonical" href="https://wordink.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WordInk" />
    <meta property="og:title" content="WordInk — find the rarest word each day" />
    <meta
      property="og:description"
      content="Every day, everyone gets the same few letters — say INK. Find the rarest word you can that contains them, like wrinkle or inkling, in four guesses."
    />
    <meta property="og:url" content="https://www.wordink.app/" />
    <meta property="og:image" content="https://www.wordink.app/og-image.png?v=3" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WordInk — find the rarest word each day" />
    <meta
      name="twitter:description"
      content="Every day, everyone gets the same few letters — say INK. Find the rarest word you can that contains them, like wrinkle or inkling, in four guesses."
    />
    <meta name="twitter:image" content="https://www.wordink.app/og-image.png?v=3" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Loaded without blocking the first paint: a stylesheet <link> holds up
      rendering until a third-party server answers, and the fonts already swap
      in when they arrive (display=swap). `media="print"` fetches it at low
      priority without applying it; onload flips it on.

      The onload is an inline handler: a Content-Security-Policy added later
      (vercel.json sets none today) has to allow it -- 'unsafe-hashes' with its
      hash, or 'unsafe-inline' -- or the fonts silently stay on `print`. The
      same goes for the boot screen's inline <style> and <script> below.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,400;0,500;0,700;0,800;1,400&family=Libre+Franklin:wght@600;700;800;900&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,400;0,500;0,700;0,800;1,400&family=Libre+Franklin:wght@600;700;800;900&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!--
      The loading screen's styles, inline so it paints from the HTML alone --
      before the stylesheet or any script has arrived. The colours are
      index.css's --bg, --fg, --fg-muted and --rarity-mythic-dot.
    -->
    <style>
      body { margin: 0; background: #fafafa; color: #1a1a1b; }
      .boot {
        display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 0.75rem; min-height: 80vh;
        font-family: "Libre Franklin", -apple-system, "Segoe UI", sans-serif;
      }
      .boot__wordmark {
        margin: 0; font-size: 1.9rem; font-weight: 900;
        letter-spacing: 0.06em; text-transform: uppercase;
      }
      .boot__wordmark span { color: #e5484d; }
      .boot__status {
        margin: 0; color: #5d6066; font-size: 0.95rem;
        font-family: "Karla", -apple-system, "Segoe UI", Roboto, sans-serif;
        animation: boot-pulse 1.4s ease-in-out infinite;
      }
      @keyframes boot-pulse { 50% { opacity: 0.4; } }
      @media (prefers-reduced-motion: reduce) {
        .boot__status { animation: none; }
      }
      .boot--failed .boot__status { animation: none; }
      .boot__retry {
        font: inherit; font-weight: 700; padding: 0.6rem 1.1rem;
        border: none; border-radius: 0.65rem; cursor: pointer;
        background: #1a1a1b; color: #fafafa;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #121213; color: #f4f4f5; }
        .boot__status { color: #a7aab0; }
        .boot__retry { background: #f4f4f5; color: #121213; }
      }
    </style>
    <!-- Without JavaScript the app never comes, so neither should its loading screen. -->
    <noscript><style>.boot { display: none; }</style></noscript>

    <!--
      The loading screen's way of saying the app is not coming, rather than
      pulsing "Loading…" forever over a dead page: a file of this site's first
      load failed to arrive (its own error event, caught here in the capture
      phase), or a script of this site threw before the app could mount. A
      third-party failure, such as the fonts, is not one. After 20 seconds with
      neither, it says only that it is slow -- a large first load on a poor
      connection can take that long and still arrive, and the app replaces the
      message the moment it does. Each only acts while the boot screen is
      still in #root; once React has rendered, it is gone and this is inert.
      Before the module script, so it is listening by the time that is fetched.
    -->
    <script>
      (function () {
        function ours(url) {
          return typeof url === "string" && url.indexOf(location.origin) === 0;
        }
        function settle(message, final) {
          var boot = document.querySelector("#root > .boot");
          if (!boot || boot.classList.contains("boot--failed")) return;
          var status = boot.querySelector(".boot__status");
          status.textContent = message;
          if (!final) return;
          boot.classList.add("boot--failed");
          boot.removeAttribute("aria-hidden");
          status.setAttribute("role", "alert");
          var retry = boot.querySelector(".boot__retry");
          if (retry) return;
          retry = document.createElement("button");
          retry.type = "button";
          retry.className = "boot__retry";
          retry.textContent = "Try again";
          retry.onclick = function () { location.reload(); };
          boot.appendChild(retry);
        }
        window.addEventListener("error", function (event) {
          var target = event.target;
          var failed = target && target !== window
            ? ours(target.src) || ours(target.href)
            : ours(event.filename);
          if (failed) settle("WordInk couldn't load.", true);
        }, true);
        setTimeout(function () {
          settle("Still loading — this connection is slow.", false);
        }, 20000);
      })();
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Game",
        "name": "WordInk",
        "url": "https://wordink.app/",
        "description": "A daily game where you find the rarest word you can: everyone gets the same few letters, and hunts for the rarest word that contains them.",
        "genre": "Word game",
        "applicationCategory": "Game",
        "operatingSystem": "Any (web browser)",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
  </head>
  <body>
    <div id="root">
      <!--
        What a player sees while the app downloads, which on a slow phone
        connection is several seconds of word data. Before this the page was
        blank until React mounted, which reads as broken rather than loading.
        React's createRoot() replaces everything in #root on its first render,
        so this needs no code to take down.
      -->
      <div class="boot" aria-hidden="true">
        <p class="boot__wordmark">Word<span>Ink</span></p>
        <p class="boot__status">Loading…</p>
      </div>
      <!--
        Static fallback for crawlers/clients that don't run JS. React's
        createRoot() replaces this on mount, but that happens after the
        page paints, so it's visually hidden (not display:none, which
        some crawlers ignore the content of) to avoid a flash of this
        text before the app takes over.
      -->
      <main style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;">
        <h1>WordInk</h1>
        <p>
          A daily game where you find the rarest word you can. Every player
          gets the same 2- or 3-letter drop each day and enters valid English
          words that contain it, in order, for up to 4 distinct guesses. The
          rarer the word, the better the result.
        </p>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
